[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oauth2-server-demo"
version = "0.1.0"
description = "A minimal, readable OAuth2 Authorization Server demo (Authorization Code + PKCE) built with FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthews Wong" }]
keywords = ["oauth2", "pkce", "fastapi", "jwt", "demo", "education"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["authserver*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
